[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketing-core"
version = "0.1.0"
description = "Pricing, fee economics and refund orchestration for a Stripe Connect ticketing platform"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Peter Stoyanov"}]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
